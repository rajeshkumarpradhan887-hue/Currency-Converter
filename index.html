
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Currency Converter</h1>
        <p class="subtitle">Convert currencies around the world</p>

        <form id="converter-form">
            <label for="amount">Enter Amount</label>
            <input
                type="number"
                id="amount"
                value="1"
                min="0.01"
                step="any"
                placeholder="Enter amount"
                required
            >

            <div class="currency-box">
                <div class="currency">
                    <label for="from">From</label>
                    <div class="select-container">
                        <img id="from-flag"
                            src="https://flagsapi.com/US/flat/64.png"
                            alt="US flag">
                        <select id="from" name="from">
                            <option value="USD" selected>USD</option>
                            <option value="INR">INR</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="JPY">JPY</option>
                            <option value="CAD">CAD</option>
                            <option value="AUD">AUD</option>
                            <option value="CNY">CNY</option>
                            <option value="AED">AED</option>
                        </select>
                    </div>
                </div>

                <button type="button" id="swap" title="Swap currencies">
                    ⇄
                </button>

                <div class="currency">
                    <label for="to">To</label>
                    <div class="select-container">
                        <img id="to-flag"
                            src="https://flagsapi.com/IN/flat/64.png"
                            alt="India flag">
                        <select id="to" name="to">
                            <option value="INR" selected>INR</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="GBP">GBP</option>
                            <option value="JPY">JPY</option>
                            <option value="CAD">CAD</option>
                            <option value="AUD">AUD</option>
                            <option value="CNY">CNY</option>
                            <option value="AED">AED</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" id="convert-btn">
                Convert Currency
            </button>

            <div class="result" aria-live="polite">
                <p id="status">Enter an amount and click convert.</p>
                <h2 id="result">--</h2>
                <p id="rate"></p>
            </div>
        </form>

        <p class="footer">Exchange rates may change throughout the day.</p>
    </div>

</body>
</html>
